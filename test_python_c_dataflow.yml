nodes:
  # Python仿真节点 - 接收tick输入并生成数据
  - id: lidar_sim
    path: sim/dora_lidar_sim.py
    inputs:
      tick: dora/timer/millis/10  # 10ms触发一次，100Hz
    outputs:
      - scan
      
  - id: imu_sim  
    path: sim/dora_imu_sim.py
    inputs:
      tick: dora/timer/millis/20  # 20ms触发一次，50Hz
    outputs:
      - data

  # C++测试节点 - 接收仿真数据
  - id: test_sim_data
    path: sim/build/test_sim_data_node
    inputs:
      scan: lidar_sim/scan
      data: imu_sim/data
      tick: dora/timer/millis/1000  # 每秒输出统计信息

  # 可选：原有的C++节点用于对比
  # - id: amcl_test
  #   path: build/amcl/build/test
  #   inputs:
  #     tick: dora/timer/millis/10
  #     scan2: lidar_sim/scan
  #     imu: imu_sim/data
  #     twist: static_zero_twist
