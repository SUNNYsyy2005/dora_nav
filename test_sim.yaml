nodes:
  - id: lidar_sim
    path: sim/dora_lidar_sim.py
    inputs:
      tick: dora/timer/millis/10  # 10ms触发一次，100Hz
    outputs:
      - scan
  - id: imu_sim  
    path: sim/dora_imu_sim.py
    inputs:
      tick: dora/timer/millis/20  # 20ms触发一次，50Hz
    outputs:
      - data
  - id: amcl
    path: build/amcl/build/test
    inputs:
      tick: dora/timer/millis/10
      scan2: lidar_sim/scan
      imu: imu_sim/data
      twist: teb/twist
    outputs:
        - pose
  - id: teb
    path: build/teb/build/test
    inputs:
      tick: dora/timer/millis/500
      pose: amcl_sim/pose
      scan: lidar_sim/scan
    outputs:
      - twist